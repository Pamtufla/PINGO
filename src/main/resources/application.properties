spring.application.name=pingo
server.port=${PORT:8080}

# ===== BASE DE DATOS =====
# Local (sin env): H2 en memoria — el bingo online NO depende de esto
# (usa Supabase REST/Realtime desde static/js/config.js).
#
# En Render, para conectar Spring → Postgres de Supabase, define las env vars.
# Preferible Session pooler (IPv4). Direct db.* suele fallar en Render por IPv6.
#
# Ejemplo Direct (el que copiaste):
#   SPRING_DATASOURCE_URL=jdbc:postgresql://db.oyymnewahufepciblafy.supabase.co:5432/postgres
#   SPRING_DATASOURCE_USERNAME=postgres
#   SPRING_DATASOURCE_PASSWORD=tu_password_de_supabase
#   SPRING_DATASOURCE_DRIVER=org.postgresql.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:pingo;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

spring.web.resources.cache.cachecontrol.max-age=60
