<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Bingo de Halloween</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎃</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="sprites.css">
</head>
<body>
<i class="circ" aria-hidden="true"></i>

<!-- PANTALLA 1 -->
<main id="home" class="screen on">
  <div class="moon" aria-hidden="true"></div>
  <svg class="web" viewBox="0 0 100 100" fill="none" stroke="#f6ecd9" stroke-width="1" aria-hidden="true"><path d="M0 0L100 0M0 0L0 100M0 0L90 55M0 0L55 90M0 0L100 25M0 0L25 100"/><path d="M20 0Q18 18 0 20M40 0Q36 36 0 40M60 0Q54 54 0 60M80 0Q72 72 0 80"/></svg>
  <i class="fl bat" style="left:8%;top:62%" aria-hidden="true"></i>
  <i class="fl pk" style="right:10%;top:72%;animation-delay:-1s" aria-hidden="true"></i>
  <i class="fl bat" style="left:70%;top:22%;animation-delay:-1.5s" aria-hidden="true"></i>
  <i class="fl bot" style="left:6%;top:14%;animation-delay:-.5s" aria-hidden="true"></i>
  <i class="fl gh" style="right:6%;bottom:8%" aria-hidden="true"></i>
  <i class="fl skull" style="left:42%;bottom:6%;animation-delay:-1s" aria-hidden="true"></i>
  <div class="wrap" style="position:relative">
    <div aria-hidden="true"><i class="spr pk"></i><i class="spr bat"></i><i class="spr pk"></i></div>
    <h1 class="title" id="appTitle">BINGO DE<br>HALLOWEEN</h1>
    <p class="sub">¿Cuántas cosas puedes encontrar esta noche?</p>
    <button class="btn" id="resume" style="display:none;margin-bottom:12px">> CONTINUAR CARTILLA</button>
    <button class="btn" id="goName">COMENZAR BINGO</button>
    <p class="tiny">Sin cuentas. Sin contraseñas. Solo mala fe.</p>
  </div>
</main>

<!-- PANTALLA 2 -->
<main id="name" class="screen">
  <i class="fl gh" style="right:6%;bottom:6%" aria-hidden="true"></i>
  <i class="fl bot" style="left:5%;bottom:8%" aria-hidden="true"></i>
  <svg class="web" viewBox="0 0 100 100" fill="none" stroke="#f6ecd9" stroke-width="1" aria-hidden="true"><path d="M0 0L100 0M0 0L0 100M0 0L90 55M0 0L55 90M0 0L100 25M0 0L25 100"/><path d="M20 0Q18 18 0 20M40 0Q36 36 0 40M60 0Q54 54 0 60M80 0Q72 72 0 80"/></svg>
  <div class="wrap stack" style="position:relative">
    <h2>¿Cómo te llamas?</h2>
    <label for="nameIn" style="position:absolute;left:-9999px">Tu nombre</label>
    <input id="nameIn" maxlength="20" placeholder="Escribe tu nombre" autocomplete="given-name">
    <p class="or" style="margin:0">Tamaño de la cartilla</p>
    <div id="sizes" style="width:100%"></div>
    <label for="codeIn" style="position:absolute;left:-9999px">Código de cartilla opcional</label>
    <input id="codeIn" maxlength="14" placeholder="¿Código de cartilla? (opcional)" autocapitalize="characters">
    <button class="btn" id="startNamed">EMPEZAR BINGO</button>
    <span class="or">o</span>
    <button class="btn ghost" id="startGuest">CONTINUAR COMO INVITADO</button>
    <button class="btn ghost" id="backName">← VOLVER</button>
  </div>
</main>

<!-- PANTALLA 3 -->
<main id="game" class="screen">
  <i class="fl bot" style="right:3%;bottom:6px;opacity:.3" aria-hidden="true"></i>
  <i class="fl gh" style="left:3%;bottom:6px;opacity:.3" aria-hidden="true"></i>
  <div class="wrap">
    <div class="head">
      <h2 id="gTitle"></h2>
      <div class="prog"><span id="gCount"></span><span class="bar" aria-hidden="true"><i id="gBar"></i></span><span id="gPct"></span></div>
      <p class="retos" id="gReto"></p>
    </div>
    <div class="grid" id="grid" role="group" aria-label="Cartilla de bingo"></div>
    <div class="code"><span>Código de cartilla:</span><button id="codeBtn" aria-label="Copiar código de cartilla"></button></div>
    <div class="row">
      <button class="btn sm" id="share">COMPARTIR</button>
      <button class="btn sm ghost" id="newCard">NUEVA CARTILLA</button>
    </div>
    <div class="row">
      <button class="btn sm ghost" id="toHub">VOLVER AL INICIO</button>
    </div>
  </div>
</main>

<!-- PANTALLA 4 / diálogos -->
<div id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="box">
    <div class="em" id="mEmoji"></div>
    <h2 id="mTitle"></h2>
    <p id="mText"></p>
    <div id="mExtra"></div>
    <div class="stack" id="mBtns"></div>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
