<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0712">
<title>Bingo de Halloween</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎃</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ===== COLORES: cámbialos aquí ===== */
:root{--bg:#0d0712;--p1:#1b0f2a;--p2:#2d1647;--line:#5a3490;--pu:#7c3aed;--or:#ff7a1a;--or2:#ffb066;--cr:#f6ecd9;--mut:#b9a8cf;
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);background-image:radial-gradient(ellipse at 80% 0%,#3b1670 0%,transparent 55%),radial-gradient(ellipse at 0% 100%,#4a1d05 0%,transparent 50%);background-attachment:fixed;color:var(--cr);font-family:'DM Sans',system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
h1,h2,.btn,.title{font-family:'Bowlby One',Impact,'Arial Black',sans-serif;font-weight:400}
.screen{display:none;min-height:100dvh;padding:20px 14px 28px;flex-direction:column;align-items:center;position:relative}
.screen.on{display:flex}
.wrap{width:100%;max-width:560px;margin:0 auto}
/* decoración */
.moon{position:absolute;top:34px;right:-30px;width:130px;height:130px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3d6,#e9c98a 60%,#b58c4a);box-shadow:0 0 70px 10px rgba(255,200,120,.25);opacity:.9;pointer-events:none}
.web{position:absolute;top:0;left:0;width:120px;opacity:.35;pointer-events:none}
.fl{position:absolute;font-size:30px;opacity:.28;pointer-events:none;animation:bob 5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-12px) rotate(6deg)}}
/* home */
#home{justify-content:center;text-align:center}
.title{font-size:clamp(40px,13vw,76px);line-height:.95;color:var(--or);text-shadow:4px 4px 0 #4c1d95,0 0 30px rgba(255,122,26,.35);margin:0 0 6px;animation:flick 6s infinite}
@keyframes flick{0%,92%,96%,100%{opacity:1}94%{opacity:.55}98%{opacity:.8}}
.sub{font-size:19px;color:var(--cr);margin:14px 0 34px}
.tiny{color:var(--mut);font-size:13px;margin-top:22px}
/* botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:12px 22px;border:0;border-radius:14px;background:var(--or);color:#1a0b00;font-size:16px;cursor:pointer;box-shadow:0 5px 0 #a8460a;transition:transform .08s,box-shadow .08s,filter .15s;width:100%;max-width:340px;touch-action:manipulation}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #a8460a}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--cr);border:2px solid var(--line);box-shadow:none}
.btn.sm{min-height:48px;font-size:14px;padding:10px 12px;max-width:none;flex:1}
:focus-visible{outline:3px solid var(--cr);outline-offset:3px}
/* formulario */
#name{justify-content:center;text-align:center}
h2{font-size:28px;margin:0 0 18px;color:var(--or)}
input{width:100%;max-width:340px;min-height:54px;border-radius:14px;border:2px solid var(--line);background:var(--p1);color:var(--cr);font:600 18px 'DM Sans',sans-serif;padding:10px 16px;text-align:center;margin-bottom:12px}
input::placeholder{color:#8d7aa8}
.stack{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}
.or{color:var(--mut);font-size:14px}
/* juego */
.head{text-align:center;margin-bottom:12px}
.head h2{font-size:clamp(22px,7vw,30px);margin:0 0 8px;overflow-wrap:anywhere}
.prog{display:flex;align-items:center;gap:10px;justify-content:center;font-weight:700;font-size:15px}
.bar{flex:1;max-width:220px;height:14px;border-radius:9px;background:var(--p1);border:2px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pu),var(--or));transition:width .35s}
.grid{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:8px;width:100%}
.cell{aspect-ratio:1;border-radius:10px;background:var(--p2);border:2px solid var(--line);color:var(--cr);padding:3px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.12;overflow:hidden;overflow-wrap:anywhere;hyphens:auto;position:relative;cursor:pointer;font:600 clamp(14px,4.4vw,19px)/1.15 'DM Sans',sans-serif;touch-action:manipulation;transition:background .2s,transform .12s,border-color .2s}
.cell.t1{font-size:clamp(17px,5.4vw,25px)}
.cell.t3{font-size:clamp(13px,3.9vw,17px)}
.cell:hover{border-color:var(--or2)}
.cell:active{transform:scale(.93)}
.cell.on{background:var(--or);border-color:var(--or2);color:#1a0b00;font-weight:700}
.cell.on::after{content:"✓";position:absolute;top:1px;right:4px;font-size:15px;font-weight:700;animation:pop .35s cubic-bezier(.3,1.8,.5,1)}
@keyframes pop{from{transform:scale(0) rotate(-40deg)}}
.cell.win{box-shadow:0 0 0 3px var(--cr),0 0 16px 3px var(--or);z-index:1}
.cell.free{font-size:14px;flex-direction:column;cursor:default;background:#4c1d95;border-color:var(--pu);color:var(--cr)}
.cell.free b{font-size:clamp(34px,11vw,56px);display:block}
.code{display:flex;align-items:center;justify-content:center;gap:10px;margin:14px 0 4px;color:var(--mut);font-size:14px;flex-wrap:wrap}
.code button{background:var(--p1);color:var(--cr);border:2px solid var(--line);border-radius:10px;min-height:44px;padding:0 12px;font:700 15px 'DM Sans',sans-serif;letter-spacing:.5px;cursor:pointer}
.row{display:flex;gap:10px;margin-top:14px}
/* modal */
#modal{position:fixed;inset:0;background:rgba(5,2,10,.85);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
#modal.on{display:flex}
.box{background:var(--p1);border:3px solid var(--or);border-radius:22px;padding:24px 18px;max-width:380px;width:100%;text-align:center;box-shadow:0 0 50px rgba(255,122,26,.3);animation:box .35s cubic-bezier(.3,1.5,.5,1)}
@keyframes box{from{transform:scale(.7);opacity:0}}
.box .em{font-size:38px;letter-spacing:6px}
.box h2{font-size:42px;margin:6px 0}
.box p{margin:6px 0 12px;font-size:16px}
.box .stack{margin-top:14px}
.mini{display:grid;gap:3px;width:110px;margin:10px auto 0}
.mini i{aspect-ratio:1;border-radius:3px;background:var(--p2);border:1px solid var(--line)}
.mini i.w{background:var(--or);border-color:var(--or2)}
.cf{position:fixed;top:-30px;z-index:60;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(720deg)}}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,40px);background:var(--cr);color:#1a0b00;font-weight:700;padding:12px 18px;border-radius:12px;opacity:0;transition:.25s;z-index:70;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- PANTALLA 1 -->
<main id="home" class="screen on">
  <div class="moon" aria-hidden="true"></div>
  <svg class="web" viewBox="0 0 100 100" fill="none" stroke="#f6ecd9" stroke-width="1" aria-hidden="true"><path d="M0 0L100 0M0 0L0 100M0 0L90 55M0 0L55 90M0 0L100 25M0 0L25 100"/><path d="M20 0Q18 18 0 20M40 0Q36 36 0 40M60 0Q54 54 0 60M80 0Q72 72 0 80"/></svg>
  <span class="fl" style="left:8%;top:62%" aria-hidden="true">🦇</span>
  <span class="fl" style="right:10%;top:72%;animation-delay:-2s" aria-hidden="true">👻</span>
  <span class="fl" style="left:70%;top:22%;animation-delay:-3s" aria-hidden="true">🦇</span>
  <div class="wrap" style="position:relative">
    <div aria-hidden="true" style="font-size:34px">🎃 🦇 🎃</div>
    <h1 class="title" id="appTitle">BINGO DE<br>HALLOWEEN</h1>
    <p class="sub">¿Cuántas cosas puedes encontrar esta noche?</p>
    <button class="btn" id="goName">COMENZAR BINGO</button>
    <p class="tiny">Sin cuentas. Sin contraseñas. Solo mala fe.</p>
  </div>
</main>

<!-- PANTALLA 2 -->
<main id="name" class="screen">
  <svg class="web" viewBox="0 0 100 100" fill="none" stroke="#f6ecd9" stroke-width="1" aria-hidden="true"><path d="M0 0L100 0M0 0L0 100M0 0L90 55M0 0L55 90M0 0L100 25M0 0L25 100"/><path d="M20 0Q18 18 0 20M40 0Q36 36 0 40M60 0Q54 54 0 60M80 0Q72 72 0 80"/></svg>
  <div class="wrap stack" style="position:relative">
    <h2>¿Cómo te llamas?</h2>
    <label for="nameIn" style="position:absolute;left:-9999px">Tu nombre</label>
    <input id="nameIn" maxlength="20" placeholder="Escribe tu nombre" autocomplete="given-name">
    <label for="codeIn" style="position:absolute;left:-9999px">Código de cartilla opcional</label>
    <input id="codeIn" maxlength="14" placeholder="¿Código de cartilla? (opcional)" autocapitalize="characters" style="font-size:15px;min-height:46px">
    <button class="btn" id="startNamed">EMPEZAR BINGO</button>
    <span class="or">o</span>
    <button class="btn ghost" id="startGuest">CONTINUAR COMO INVITADO</button>
  </div>
</main>

<!-- PANTALLA 3 -->
<main id="game" class="screen">
  <div class="wrap">
    <div class="head">
      <h2 id="gTitle"></h2>
      <div class="prog"><span id="gCount"></span><span class="bar" aria-hidden="true"><i id="gBar"></i></span><span id="gPct"></span></div>
    </div>
    <div class="grid" id="grid" role="group" aria-label="Cartilla de bingo"></div>
    <div class="code"><span>Código de cartilla:</span><button id="codeBtn" aria-label="Copiar código de cartilla"></button></div>
    <div class="row">
      <button class="btn sm" id="share">📤 COMPARTIR</button>
      <button class="btn sm ghost" id="newCard">🔄 NUEVA CARTILLA</button>
    </div>
  </div>
</main>

<!-- PANTALLA 4 / diálogos -->
<div id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="box">
    <div class="em" id="mEmoji"></div>
    <h2 id="mTitle"></h2>
    <p id="mText"></p>
    <div id="mExtra"></div>
    <div class="stack" id="mBtns"></div>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ===== CONFIGURACIÓN: cambia textos y reglas aquí ===== */
const CONFIG = {
  APP_NAME: 'Bingo de Halloween',
  SIZE: 3,                    // 3 = cartilla 3×3 (el banco debe tener al menos SIZE*SIZE)
  FREE: true,                 // casilla central LIBRE (solo si SIZE es impar)
  CODE_PREFIX: 'HALLOWEEN-',
  STORAGE_KEY: 'bingo-halloween-v1'
};

/* ===== BANCO DE CASILLAS: agrega, borra o edita líneas ===== */
const BANK = [
  "Un fantasma que parece que sí murió",
  "Un niño con cara de necesitar terapia",
  "Un adulto llorando detrás de la máscara",
  "Un niño más aterrador que su disfraz",
  "Un esqueleto con mejor postura que tú",
  "Un payaso que debería estar vigilado",
  "Un asesino con el cuchillo de su mamá",
  "Sangre falsa con demasiada convicción",
  "Un niño cobrando dulces como una deuda",
  "Una abuela con más dulces que moral",
  "Un fantasma con hoyo para el celular",
  "Alguien disfrazado de mal diagnóstico",
  "Un zombie que ya venía así de casa",
  "Un niño sin ningún adulto a la vista",
  "Un adulto robándole dulces a un niño",
  "Una calabaza tallada con cara de tu ex",
  "Un vecino fingiendo no estar en casa",
  "Dulces vencidos desde 2019",
  "Un dulce sin envoltorio. Sospechoso",
  "Un perro que te juzga en silencio",
  "Un gato con plan de venganza",
  "Mascota más tolerante que su dueño",
  "Un muerto viviente con 2 horas de sueño",
  "Alguien que da más miedo sin disfraz",
  "Una pareja peleando en pleno disfraz",
  "Dos disfraces iguales",
  "Un grupo que no sabe quién eligió el tema",
  "Un amigo que ya vomitó. Son las 9",
  "Alguien llorando y diciendo “estoy bien”",
  "Buen intento P Diddy",
  "Un asesino serial con sudadera de la U",
  "Una momia desenrollándose en público",
  "Un disfraz roto, ahora es denuncia",
  "Alguien disfrazado de un lunes",
  "Alguien disfrazado de su saldo bancario",
  "Un zombie con mejor vida social que tú",
  "Una persona sola entre mil disfraces",
  "Un chiste de muertos que cayó mal",
  "Un velorio con mejor ambiente que esto",
  "Un señor de 40 pidiendo dulces en serio",
  "Alguien dando el pésame al “muerto”",
  "Un bulto en el piso: ¿borracho o cadáver?",
  "Un niño disfrazado de oficinista",
  "Un oficinista disfrazado de oficinista",
  "Un “zombie” con resaca de ayer",
  "Un amigo que se rindió y se fue a casa",
  "Una máscara que da miedo al sonreír",
  "Una bruja con mejor trabajo que tú",
  "Una calabaza podrida del año pasado",
  "Una tumba de cartón con nombre mal escrito",
  "Un adorno que da miedo sin razón",
  "“Yo no creo en esto” corriendo",
  "Un NPC cargando una bolsa de dulces",
  "Un grupo que se odia, pero posa",
  "Alguien pidiendo dulces como amenaza",
  "Una caja de dulces abandonada a su suerte",
  "Un doctor que no es doctor",
  "Una “mordida” que en realidad es chupetón",
  "Un bebé con cara de arrepentirse de nacer",
  "Alguien que se cae y sigue en personaje",
  "Un cadáver fingido que sí se movió",
  "Una sombra que resultó ser un vecino",
  "Un adulto asustando niños demasiado bien",
  "Una casa a oscuras con un ruido raro",
  "Un disfraz que ya olía a muerto",
  "Un hombre arrastrando a su amigo “muerto”",
  "Un sobreviviente de una mala decisión",
  "Un fantasma que no sabe que murió",
  "Alguien con la lápida de su sueldo"
];

/* ===== LÓGICA ===== */
const $ = s => document.querySelector(s);
const N = CONFIG.SIZE, TOTAL = N * N;
const HAS_FREE = CONFIG.FREE && N % 2 === 1;
const FREE_IDX = (TOTAL - 1) / 2;
const POOL = [...new Set(BANK)];               // quita duplicados del banco por seguridad
const NEED = TOTAL - (HAS_FREE ? 1 : 0);
let st = null;

function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function randCode(){return Math.floor(Math.random()*65536).toString(16).toUpperCase().padStart(4,'0')}
// Misma semilla + mismo banco = misma cartilla
function build(code){
  const r = rng(parseInt(code,16));
  const a = POOL.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
  const cells = a.slice(0,NEED);               // los primeros NEED del mezclado: sin repetidos
  if(HAS_FREE) cells.splice(FREE_IDX,0,null);
  return cells;
}
function lines(){
  const L=[];
  for(let r=0;r<N;r++)L.push({id:'r'+r,name:'Fila '+(r+1),c:[...Array(N)].map((_,c)=>r*N+c)});
  for(let c=0;c<N;c++)L.push({id:'c'+c,name:'Columna '+(c+1),c:[...Array(N)].map((_,r)=>r*N+c)});
  L.push({id:'d1',name:'Diagonal ↘',c:[...Array(N)].map((_,i)=>i*N+i)});
  L.push({id:'d2',name:'Diagonal ↙',c:[...Array(N)].map((_,i)=>i*N+(N-1-i))});
  return L;
}
const LINES = lines();
function save(){try{localStorage.setItem(CONFIG.STORAGE_KEY,JSON.stringify(st))}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem(CONFIG.STORAGE_KEY));if(s&&Array.isArray(s.cells)&&s.cells.length===TOTAL&&Array.isArray(s.marked))return s}catch(e){}return null}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));window.scrollTo(0,0)}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2200)}
function parseCode(v){const m=String(v||'').trim().toUpperCase().replace(CONFIG.CODE_PREFIX,'');return /^[0-9A-F]{4}$/.test(m)?m:null}

function fresh(code){
  st.code=code; st.cells=build(code);
  st.marked=st.cells.map(c=>c===null); st.bingos=[];
  save(); renderGrid(); update();
}
function renderGrid(){
  const g=$('#grid'); g.innerHTML=''; g.style.setProperty('--n',N);
  st.cells.forEach((t,i)=>{
    const b=document.createElement('button'); b.type='button'; b.className='cell';
    if(t===null){b.classList.add('free');b.disabled=true;b.innerHTML='<b>🎃</b>LIBRE';b.setAttribute('aria-label','Casilla libre, ya marcada');}
    else{b.textContent=t;b.classList.add(t.length<26?'t1':t.length>44?'t3':'t2');b.dataset.i=i;b.setAttribute('aria-pressed','false');b.setAttribute('aria-label',t);b.onclick=()=>toggle(i)}
    g.append(b);
  });
}
function done(){
  const d=LINES.filter(l=>l.c.every(i=>st.marked[i]));
  if(st.marked.every(Boolean)) d.push({id:'full',name:'¡Cartilla completa!',c:[...Array(TOTAL).keys()]});
  return d;
}
function update(){
  const d=done(), win=new Set(); d.filter(l=>l.id!=='full').forEach(l=>l.c.forEach(i=>win.add(i)));
  [...$('#grid').children].forEach((b,i)=>{
    if(st.cells[i]===null){b.classList.toggle('win',win.has(i));return}
    b.classList.toggle('on',!!st.marked[i]); b.setAttribute('aria-pressed',!!st.marked[i]); b.classList.toggle('win',win.has(i));
  });
  const found=st.marked.filter((m,i)=>m&&st.cells[i]!==null).length, pct=Math.round(found/NEED*100);
  $('#gTitle').textContent='Bingo de '+st.name+' 🎃';
  $('#gCount').textContent=found+' / '+NEED+' encontrados';
  $('#gBar').style.width=pct+'%'; $('#gPct').textContent=pct+'%';
  $('#codeBtn').textContent=CONFIG.CODE_PREFIX+st.code+' 📋';
  return d;
}
function toggle(i){
  st.marked[i]=!st.marked[i];
  if(navigator.vibrate)try{navigator.vibrate(12)}catch(e){}
  const d=update();
  const fresh_=d.filter(l=>!st.bingos.includes(l.id));
  st.bingos=d.map(l=>l.id); save();
  if(fresh_.length&&st.marked[i]) bingo(fresh_);
}
function mini(set){
  const m=document.createElement('div');m.className='mini';m.style.gridTemplateColumns='repeat('+N+',1fr)';
  for(let i=0;i<TOTAL;i++){const c=document.createElement('i');if(set.has(i))c.className='w';m.append(c)}
  return m;
}
function bingo(ls){
  const full=ls.some(l=>l.id==='full'), set=new Set(); ls.forEach(l=>l.c.forEach(i=>set.add(i)));
  confetti();
  modal({emoji:'🎃 👻 🎃',title:full?'¡CARTILLA!':'¡BINGO!',
    text:(full?'¡Completaste TODA la cartilla! ':'Acabas de completar: '+ls.map(l=>l.name).join(' + ')+'. ')+'¡Encontraste '+(full?NEED:N)+' cosas de Halloween!',
    extra:full?null:mini(set),btns:[['SEGUIR JUGANDO','',null]]});
}
function modal({emoji,title,text,extra,btns}){
  $('#mEmoji').textContent=emoji||''; $('#mTitle').textContent=title; $('#mText').textContent=text||'';
  const x=$('#mExtra');x.innerHTML='';if(extra)x.append(extra);
  const b=$('#mBtns');b.innerHTML='';
  btns.forEach(([l,cls,fn])=>{const e=document.createElement('button');e.className='btn '+cls;e.textContent=l;e.onclick=()=>{$('#modal').classList.remove('on');if(fn)fn()};b.append(e)});
  $('#modal').classList.add('on'); b.firstChild.focus();
}
function confetti(){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const em=['🎃','🦇','👻','🕸️','🌙'],col=['#ff7a1a','#7c3aed','#f6ecd9','#ffb066'];
  for(let i=0;i<46;i++){
    const s=document.createElement('span');s.className='cf';
    if(i%3===0){s.textContent=em[i%5];s.style.fontSize=(18+Math.random()*14)+'px'}
    else{s.style.width='9px';s.style.height='14px';s.style.background=col[i%4]}
    s.style.left=Math.random()*100+'vw';s.style.animationDuration=(1.6+Math.random()*1.6)+'s';s.style.animationDelay=Math.random()*.5+'s';
    document.body.append(s);setTimeout(()=>s.remove(),3800);
  }
}
function copy(text){
  if(navigator.clipboard&&window.isSecureContext)return navigator.clipboard.writeText(text);
  return new Promise((ok,no)=>{const t=document.createElement('textarea');t.value=text;t.style.cssText='position:fixed;opacity:0';document.body.append(t);t.select();try{document.execCommand('copy')?ok():no()}catch(e){no()}t.remove()});
}
function shareText(){
  const found=st.marked.filter((m,i)=>m&&st.cells[i]!==null).length;
  return '🎃 '+CONFIG.APP_NAME+'\nJugador: '+st.name+'\n'+found+'/'+NEED+' encontrados\nCódigo: '+CONFIG.CODE_PREFIX+st.code;
}
async function share(){
  const text=shareText();
  if(navigator.share){try{await navigator.share({title:CONFIG.APP_NAME,text});return}catch(e){if(e&&e.name==='AbortError')return}}
  try{await copy(text);toast('Copiado. Pégalo en el grupo 📋')}catch(e){toast('No se pudo copiar')}
}
function start(name,codeRaw){
  let code=null;
  if(codeRaw&&codeRaw.trim()){code=parseCode(codeRaw);if(!code){toast('Código inválido. Ej: '+CONFIG.CODE_PREFIX+'7F3A');return}}
  st={name:name||'invitado',code:'',cells:[],marked:[],bingos:[]};
  fresh(code||randCode()); show('game');
}

/* ===== EVENTOS ===== */
document.title=CONFIG.APP_NAME;
$('#goName').onclick=()=>{show('name');$('#nameIn').focus()};
$('#startNamed').onclick=()=>{const n=$('#nameIn').value.trim();if(!n){toast('Escribe tu nombre o entra como invitado');$('#nameIn').focus();return}start(n,$('#codeIn').value)};
$('#startGuest').onclick=()=>start('',$('#codeIn').value);
$('#nameIn').addEventListener('keydown',e=>{if(e.key==='Enter')$('#startNamed').click()});
$('#share').onclick=share;
$('#codeBtn').onclick=()=>copy(CONFIG.CODE_PREFIX+st.code).then(()=>toast('Código copiado')).catch(()=>toast('No se pudo copiar'));
$('#newCard').onclick=()=>modal({emoji:'🔄',title:'¿NUEVA?',text:'¿Quieres generar una nueva cartilla? Perderás el progreso actual.',
  btns:[['CANCELAR','ghost',null],['NUEVA CARTILLA','',()=>fresh(randCode())]]});

/* ===== ARRANQUE: retoma la cartilla guardada ===== */
st=load();
if(st){renderGrid();update();show('game')}
</script>
</body>
</html>
